services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    # 网页管理。机器人本身只往外连 Telegram，只有这一个端口对外，有 HTTPS 和登录密钥
    ports:
      - "${WEB_PORT:-8443}:8443"
    volumes:
      - data:/data
    # 容器不给多余权限
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 防止异常时把服务器上别的服务挤掉
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
