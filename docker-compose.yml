services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - data:/data
    # 机器人只需要往外连 Telegram，不开端口，容器也不给多余权限
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
